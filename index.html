<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
        }

        .timer-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            padding: 3rem 4rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 480px;
            /* Slightly wider for inputs */
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-weight: 200;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .time-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
        }

        .time-input {
            width: 140px;
            font-size: 6rem;
            font-weight: 600;
            line-height: 1;
            background: transparent;
            border: none;
            color: inherit;
            text-align: center;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 0;
            margin: 0;
        }

        .time-input::placeholder {
            -webkit-text-fill-color: rgba(255, 255, 255, 0.2);
        }

        .time-input:focus {
            outline: none;
            text-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        /* Hide spinner controls */
        .time-input::-webkit-inner-spin-button,
        .time-input::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .colon {
            font-size: 5rem;
            font-weight: 200;
            margin-top: -1rem;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.7;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        button {
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.05em;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(99, 102, 241, 0.6);
            background: var(--accent-hover);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulse animation for the timer when active */
        .timer-active .time-input {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            }

            50% {
                text-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
            }

            100% {
                text-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
            }
        }
    </style>
</head>

<body>

    <div class="timer-card">
        <h1>Focus</h1>
        <div class="time-container" id="timeContainer">
            <input type="number" class="time-input" id="minutesInput" value="25" min="0" max="99">
            <span class="colon">:</span>
            <input type="number" class="time-input" id="secondsInput" value="00" min="0" max="59">
        </div>
        <div class="controls">
            <button class="btn-primary" id="toggleBtn">Start</button>
            <button class="btn-secondary" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        let totalSeconds = 25 * 60;
        let intervalId = null;
        let isRunning = false;

        // DOM Elements
        const minutesInput = document.getElementById('minutesInput');
        const secondsInput = document.getElementById('secondsInput');
        const timeContainer = document.getElementById('timeContainer');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');

        let initialSecondsConfig = totalSeconds; // Store initial config to reset to

        // Note: AudioContext must be resumed on user interaction
        let audioCtx;

        function pad(num) {
            return num.toString().padStart(2, '0');
        }

        function updateInputsFromSeconds(totalSecs) {
            const mins = Math.floor(totalSecs / 60);
            const secs = totalSecs % 60;
            minutesInput.value = pad(mins);
            secondsInput.value = pad(secs);
            document.title = `${pad(mins)}:${pad(secs)} - Focus`;
        }

        function getSecondsFromInputs() {
            let mins = parseInt(minutesInput.value) || 0;
            let secs = parseInt(secondsInput.value) || 0;

            // Basic validation clamps
            if (secs > 59) { secs = 59; secondsInput.value = 59; }
            if (secs < 0) { secs = 0; secondsInput.value = "00"; }
            if (mins < 0) { mins = 0; minutesInput.value = "00"; }

            return (mins * 60) + secs;
        }

        // Input formatting on blur to ensure 2 digits
        function formatInput(e) {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 0) val = 0;
            e.target.value = pad(val);
        }

        minutesInput.addEventListener('blur', formatInput);
        secondsInput.addEventListener('blur', (e) => {
            let val = parseInt(e.target.value);
            if (val > 59) val = 59;
            if (isNaN(val) || val < 0) val = 0;
            e.target.value = pad(val);
        });

        // Update totalSeconds when user changes input while not running
        function onInputChange() {
            if (!isRunning) {
                totalSeconds = getSecondsFromInputs();
                initialSecondsConfig = totalSeconds;
            }
        }

        minutesInput.addEventListener('change', onInputChange);
        secondsInput.addEventListener('change', onInputChange);


        function playAlarm() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);

            // Double beep
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain2.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 600);
        }

        function setInputsDisabled(disabled) {
            minutesInput.disabled = disabled;
            secondsInput.disabled = disabled;
        }

        function toggleTimer() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isRunning) {
                // Pause
                clearInterval(intervalId);
                isRunning = false;
                toggleBtn.textContent = 'Start';
                timeContainer.classList.remove('timer-active');
                setInputsDisabled(false);
            } else {
                // Start
                // Ensure we capture latest input if they didn't blur/change properly?
                totalSeconds = getSecondsFromInputs();
                if (totalSeconds <= 0) return; // Don't start if 0

                isRunning = true;
                toggleBtn.textContent = 'Pause';
                timeContainer.classList.add('timer-active');
                setInputsDisabled(true);

                intervalId = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateInputsFromSeconds(totalSeconds);
                    } else {
                        // Timer Finished
                        clearInterval(intervalId);
                        isRunning = false;
                        toggleBtn.textContent = 'Start';
                        timeContainer.classList.remove('timer-active');
                        setInputsDisabled(false);
                        playAlarm();
                        // Reset to what the user had set?
                        // For now, let's leave it at 00:00 or reset. 
                        // Better UX might be to just leave it at 0.
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(intervalId);
            isRunning = false;
            // Restore the configured start time
            totalSeconds = initialSecondsConfig;
            updateInputsFromSeconds(totalSeconds);
            toggleBtn.textContent = 'Start';
            timeContainer.classList.remove('timer-active');
            setInputsDisabled(false);
        }

        toggleBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

    </script>
</body>

</html>
