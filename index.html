<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-hover: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
        }

        .timer-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--glass-border);
            padding: 3rem 4rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-weight: 200;
            font-size: 1.5rem;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .time-display {
            font-size: 6rem;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 2.5rem;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
        }

        button {
            border: none;
            padding: 1rem 2.5rem;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.05em;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 10px 20px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(99, 102, 241, 0.6);
            background: var(--accent-hover);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Pulse animation for the timer when active */
        .timer-active {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
            50% { text-shadow: 0 0 30px rgba(168, 85, 247, 0.4); }
            100% { text-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
        }

    </style>
</head>
<body>

    <div class="timer-card">
        <h1>Focus</h1>
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="controls">
            <button class="btn-primary" id="toggleBtn">Start</button>
            <button class="btn-secondary" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        const INITIAL_MINUTES = 25;
        let totalSeconds = INITIAL_MINUTES * 60;
        let intervalId = null;
        let isRunning = false;
        
        // DOM Elements
        const timeDisplay = document.getElementById('timeDisplay');
        const toggleBtn = document.getElementById('toggleBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Note: AudioContext must be resumed on user interaction
        let audioCtx;

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(totalSeconds);
            document.title = `${formatTime(totalSeconds)} - Focus`;
        }

        function playAlarm() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // A4
            oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
            
            // Double beep
            setTimeout(() => {
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc2.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gain2.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc2.connect(gain2);
                gain2.connect(audioCtx.destination);
                osc2.start();
                osc2.stop(audioCtx.currentTime + 0.5);
            }, 600);
        }

        function toggleTimer() {
            if (!audioCtx) {
                 audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isRunning) {
                // Pause
                clearInterval(intervalId);
                isRunning = false;
                toggleBtn.textContent = 'Start';
                timeDisplay.classList.remove('timer-active');
            } else {
                // Start
                isRunning = true;
                toggleBtn.textContent = 'Pause';
                timeDisplay.classList.add('timer-active');
                
                intervalId = setInterval(() => {
                    if (totalSeconds > 0) {
                        totalSeconds--;
                        updateDisplay();
                    } else {
                        // Timer Finished
                        clearInterval(intervalId);
                        isRunning = false;
                        toggleBtn.textContent = 'Start';
                        timeDisplay.classList.remove('timer-active');
                        playAlarm();
                        totalSeconds = INITIAL_MINUTES * 60; // Auto reset for now? Or stay at 00:00? 
                        // Let's stay at 00:00 visually but next click resets logic if needed. 
                        // Actually, standard behavior is stop at 0.
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(intervalId);
            isRunning = false;
            totalSeconds = INITIAL_MINUTES * 60;
            toggleBtn.textContent = 'Start';
            timeDisplay.classList.remove('timer-active');
            updateDisplay();
            document.title = 'Focus Timer';
        }

        toggleBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Initial render
        updateDisplay();

    </script>
</body>
</html>
